<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fororo</title>
<meta name="theme-color" content="#211a33">
<meta name="description" content="Fororo — ta forge d'armures qui récompense ta productivité.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Alegreya+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c46b;--ink:#f3e9dc;--muted:#b3a6c4;--bg:#211a33}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 55% at 50% 105%,#ff7a1a2a,transparent 60%),linear-gradient(#2a2140,#17122a)}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.logo{font-family:'Cinzel',serif;font-weight:800;font-size:21px;letter-spacing:3px;color:var(--gold);text-shadow:0 2px 0 #7a3a0a,0 0 14px #ff7a1a55}
.res{display:flex;gap:6px}
.chip{background:#ffffff10;border:1px solid #ffffff1c;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600}
.viewer{flex:1;position:relative;overflow:hidden;min-height:0}
.track{display:flex;height:100%;transition:transform .4s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;padding:4px 30px 0}
.slide svg{height:100%;max-height:440px;width:auto;max-width:100%;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;border:2px solid #ffffff22;background:#00000044;color:var(--ink);font-size:22px;cursor:pointer;z-index:3}
.arrow.l{left:6px}.arrow.r{right:6px}.arrow:disabled{opacity:.15}
.counter{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;z-index:3}
.info{text-align:center;padding:2px 14px 0}
.info h2{font-family:'Cinzel',serif;font-size:19px}
.badge{display:inline-block;margin-top:3px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:8px;background:#ffffff12}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:10px 12px 4px}
.slot{aspect-ratio:1;border-radius:10px;border:2px solid var(--c,#ffffff22);background:#00000035;display:grid;place-items:center;cursor:pointer;position:relative;padding:3px}
.slot.empty{border-style:dashed}
.slot svg{width:100%;height:100%}
.slot small{position:absolute;bottom:-1px;left:0;right:0;font-size:9px;color:var(--muted);text-align:center}
.slot.empty small{bottom:auto;position:static;font-size:10px}
.actions{display:flex;justify-content:center;padding:8px 14px 10px}
.btn{font-family:'Cinzel',serif;font-weight:800;font-size:15px;color:#2a1405;background:#f2a23a;border:none;border-radius:10px;padding:12px 20px;box-shadow:0 4px 0 #8a4a10;cursor:pointer;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4a10}
nav{display:flex;border-top:1px solid #ffffff14;background:#120e1fee;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:44px}
nav button span{font-size:19px}
nav button.on{color:var(--gold)}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);background:#2f2448;border:2px solid #f2c46b66;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;width:max-content;max-width:90%;text-align:center;z-index:30;display:flex;align-items:center;gap:8px}
.toast svg{width:38px;height:38px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,#fff6d0,#ff9a2a88 30%,transparent 65%);opacity:0;z-index:4}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{15%{opacity:1}100%{opacity:0}}
.sheet-bg{position:absolute;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:70%;background:#2a2140;border-top:2px solid #f2c46b55;border-radius:16px 16px 0 0;transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
.open .sheet-bg{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.sheet header{padding:14px 16px 6px}
.sheet h3{font-family:'Cinzel',serif;font-size:18px}
.close{background:none;border:none;color:var(--muted);font-size:24px;width:44px;height:44px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 16px 20px;overflow-y:auto}
.item{border-radius:10px;border:2px solid var(--c);background:#00000035;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);font-family:inherit}
.item svg{width:100%;aspect-ratio:1}
.item span{font-size:11px;font-weight:600;color:var(--c);text-align:center;line-height:1.1}
.item.remove{border-style:dashed;justify-content:center;font-size:13px}
.hint{padding:0 16px 8px;font-size:13px;color:var(--muted)}
.reset{position:absolute;right:8px;bottom:4px;background:none;border:none;color:#ffffff30;font-size:11px;cursor:pointer;z-index:3}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
#forgeScreen{overflow-y:auto;padding-bottom:16px}
.scene{height:150px;display:flex;justify-content:center;position:relative;flex-shrink:0}
.scene svg{height:100%;width:auto}
.scene .floating{position:absolute;left:58%;top:4px;width:60px;height:60px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffb04a)}
@keyframes bob{50%{transform:translateY(-6px)}}
.card{margin:8px 12px 0;background:#00000030;border:2px solid #ffffff14;border-radius:12px;padding:12px}
.card h4{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card h4 button{font-family:'Alegreya Sans',sans-serif;font-size:13px;font-weight:700;color:var(--ink);background:#ffffff14;border:1px solid #ffffff22;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.ptypes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ptype{aspect-ratio:1;border-radius:10px;border:2px solid #ffffff1c;background:#00000035;padding:4px;cursor:pointer;opacity:.5;filter:grayscale(.7)}
.ptype.sel{border-color:var(--gold);opacity:1;filter:none;background:#f2c46b1a}
.ptype svg{width:100%;height:100%}
.ptlabel{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.combo{display:flex;align-items:center;gap:8px}
.cslot{width:58px;height:58px;border-radius:10px;border:2px dashed #ffffff30;background:#00000035;display:grid;place-items:center;cursor:pointer;padding:5px;flex-shrink:0;color:var(--muted);font-size:20px}
.cslot.full{border-style:solid;border-color:#ffffff44}
.cslot svg{width:100%;height:100%}
.plus{color:var(--muted);font-weight:800}
.result{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding-left:6px;border-left:2px solid #ffffff14}
.result .ico{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;font-size:26px}
.result .ico svg{width:100%;height:100%}
.result b{display:block;font-size:14px}
.result small{display:block;font-size:12px;color:var(--muted)}
.forgego{width:100%;margin-top:12px}
.btn:disabled{opacity:.4;box-shadow:0 4px 0 #8a4a10;transform:none}
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mat{position:relative;border-radius:10px;border:2px solid #ffffff1c;background:#00000035;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:var(--ink);font-family:inherit}
.mat svg{width:100%;aspect-ratio:1.3}
.mat span{font-size:10.5px;line-height:1.1;text-align:center;color:var(--muted);min-height:23px;display:flex;align-items:center}
.mat em{position:absolute;top:2px;right:5px;font-style:normal;font-weight:800;font-size:13px}
.mat.zero{opacity:.35}
.mat.used{border-color:var(--gold)}
.job{display:flex;gap:12px;align-items:center}
.job .ico{width:64px;height:64px;flex-shrink:0}
.job .ico svg{width:100%;height:100%}
.bar{height:12px;border-radius:6px;background:#00000055;overflow:hidden;margin:6px 0 4px;border:1px solid #ffffff1c}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a1a,#ffd04a);width:0;transition:width .5s}
.timer{font-family:'Cinzel',serif;font-size:20px;font-weight:800}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 .btn{flex:1;font-size:13px;padding:10px}
.btn.ghost{background:#ffffff14;color:var(--ink);box-shadow:0 4px 0 #00000055}
.recipes{padding:4px 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.rec{display:flex;align-items:center;gap:10px;border:2px solid var(--c);border-radius:10px;padding:8px;background:#00000030}
.rec .ico{width:46px;height:46px;flex-shrink:0}
.rec .ico svg{width:100%;height:100%}
.rec b{font-size:14px;color:var(--c)}
.rec p{font-size:13px;color:var(--ink);margin-top:2px}
.rec.unk{--c:#ffffff33}
.rec.unk p{color:var(--muted);font-style:italic}
nav button{position:relative}
#journalScreen{overflow-y:auto;padding:4px 0 16px}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.today div{background:#00000035;border-radius:10px;padding:8px 4px}
.today b{display:block;font-family:'Cinzel',serif;font-size:20px}
.today small{font-size:11.5px;color:var(--muted)}
.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meal{border-radius:12px;border:2px solid #ffffff1c;background:#00000035;color:var(--ink);font-family:inherit;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px}
.meal span{font-size:26px}.meal b{font-size:13px}.meal small{font-size:11px;color:var(--muted)}
.meal.on{border-color:#7fe08a;background:#7fe08a1a}.meal.on small{color:#9be7b0}
.times{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.times label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:110px}
.times input{font-family:inherit;font-size:18px;font-weight:700;color:var(--ink);background:#00000045;border:2px solid #ffffff22;border-radius:10px;padding:8px 10px;min-height:44px;color-scheme:dark}
.big{font-size:15px;line-height:1.4}.big b{color:var(--gold)}
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.chips2 button{flex:1;min-width:70px;font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);background:#ffffff14;border:2px solid #ffffff22;border-radius:10px;padding:10px 6px;cursor:pointer;min-height:44px}
.custom{display:flex;gap:8px;margin-top:8px}
.custom input{flex:1;min-width:0;font-family:inherit;font-size:16px;color:var(--ink);background:#00000045;border:2px solid #ffffff22;border-radius:10px;padding:8px 10px;min-height:44px}
.custom button{font-family:inherit;font-weight:800;font-size:14px;color:#2a1405;background:#f2a23a;border:none;border-radius:10px;padding:0 14px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.linkbtn{background:none;border:none;color:var(--gold);font-family:inherit;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 0;min-height:36px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week div{background:#00000035;border-radius:8px;padding:6px 0;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center}
.week div.cur{outline:2px solid var(--gold)}
.week i{font-style:normal;font-size:12px;line-height:1}
.week .off{opacity:.2}
nav .dot{position:absolute;top:6px;right:calc(50% - 18px);width:10px;height:10px;border-radius:50%;background:#ff5a3a;box-shadow:0 0 6px #ff5a3a;display:none}
nav .dot.on{display:block}
#marketScreen{overflow-y:auto;padding:4px 0 16px}
.order{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff12}
.order:first-of-type{border-top:none}
.order .ico{width:52px;height:52px;flex-shrink:0;border-radius:10px;border:2px solid var(--c);background:#00000035;padding:3px}
.order .ico svg{width:100%;height:100%}
.order .txt{flex:1;min-width:0}
.order .txt b{font-size:14px;display:block}
.order .txt small{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.order .txt small em{font-style:normal;color:var(--c);font-weight:700}
.order .gold{font-weight:800;color:var(--gold);font-size:14px;white-space:nowrap}
.obtns{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.mini{font-family:inherit;font-weight:800;font-size:13px;border-radius:9px;padding:8px 12px;border:none;cursor:pointer;min-height:38px;background:#f2a23a;color:#2a1405}
.mini:disabled{opacity:.35}
.mini.ghost{background:#ffffff14;color:var(--muted);min-height:30px;padding:4px 10px;font-size:12px}
.next{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.elite{border:2px solid #ffd24a;background:linear-gradient(160deg,#ffd24a1f,#00000030 60%);box-shadow:0 0 18px #ffd24a22}
.elite .who{display:flex;gap:12px;align-items:center}
.elite .av{width:92px;height:118px;flex-shrink:0}
.elite .av svg{width:100%;height:100%}
.elite b{font-size:15px}
.elite p{font-size:13.5px;line-height:1.35;margin-top:3px}
.elite .rew{margin-top:8px;font-weight:800;color:var(--gold);font-size:14px}
.elite .left{font-size:12px;color:var(--muted)}
.chests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chest{border-radius:12px;border:2px solid var(--c);background:#00000035;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font-family:inherit;cursor:pointer;position:relative}
.chest svg{width:80%;aspect-ratio:1.2}
.chest b{font-size:13px}
.chest small{font-size:12.5px;font-weight:800;color:var(--gold)}
.chest .own{position:absolute;top:4px;right:6px;background:#ff5a3a;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px}
.chest:disabled{opacity:.45}
.droptab{width:100%;border-collapse:collapse;font-size:13px}
.droptab td,.droptab th{padding:5px 4px;text-align:center;border-bottom:1px solid #ffffff12}
.droptab th{color:var(--muted);font-weight:600;font-size:12px}
.droptab td:first-child,.droptab th:first-child{text-align:left}
.overlay{position:absolute;inset:0;background:#0b0816ee;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.overlay.on{display:flex}
.overlay h3{font-family:'Cinzel',serif;font-size:20px;color:var(--gold);text-align:center}
.bigchest{width:180px;height:160px}
.bigchest svg{width:100%;height:100%}
.bigchest.shake{animation:shake .5s ease-in-out 3}
@keyframes shake{20%{transform:rotate(-6deg) scale(1.03)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg) scale(1.06)}80%{transform:rotate(3deg)}}
.loot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:360px}
.drop{border-radius:12px;border:2px solid var(--c);background:#00000055;padding:6px 4px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.4);animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards;box-shadow:0 0 14px var(--c)}
.drop svg{width:70%;aspect-ratio:1.3}
.drop b{font-size:12px;text-align:center;line-height:1.1}
.drop small{font-size:10.5px;color:var(--c);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
@keyframes pop{to{opacity:1;transform:none}}
.sellrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 16px 20px;overflow-y:auto}
.item.arm{outline:3px solid #ff5a3a}
.standpick{display:flex;flex-direction:column;gap:8px;padding:6px 16px 20px}
.standpick button{display:flex;align-items:center;gap:10px;border-radius:12px;border:2px solid #ffd24a;background:#00000035;padding:6px 10px;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left}
.standpick svg{width:60px;height:76px}
.cost{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.cost span{display:flex;align-items:center;gap:4px;background:#00000040;border:1.5px solid #ffffff22;border-radius:8px;padding:3px 8px 3px 4px;font-size:13px;font-weight:800}
.cost span svg{width:24px;height:20px}
.cost span i{font-style:normal;font-weight:400;font-size:11px;color:var(--muted)}
.cost span.no{border-color:#ff5a3a99;color:#ff9a80}
.upg .lv{font-family:'Alegreya Sans',sans-serif;font-size:13px;color:var(--muted)}
.buyslide{position:relative;height:100%;display:flex;align-items:center;justify-content:center;opacity:.35}
.buyslide svg{height:62%!important;max-height:300px}
.buyslide span{position:absolute;font-size:90px;font-weight:800;color:var(--gold);opacity:1}
.buybox{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px}
.buybox .cost{justify-content:center}
.troph{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px}
.troph i{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--c);opacity:.35}
.troph i.on{background:var(--c);opacity:1;box-shadow:0 0 8px var(--c)}
.troph small{font-size:11.5px;color:var(--muted);margin-left:4px}
.setshow{width:190px;height:230px;filter:drop-shadow(0 0 22px var(--c));animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.setshow svg{width:100%;height:100%}
.setfx{animation:setp 3.2s ease-in-out infinite}
@keyframes setp{50%{opacity:.55}}
.spk{animation:spk 3.4s linear infinite;opacity:0}
@keyframes spk{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
.agehead{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);margin:10px 0 4px;display:flex;justify-content:space-between}
.agehead span{font-family:'Alegreya Sans',sans-serif;font-size:12.5px;color:var(--muted)}
.spf{animation:spf 3.4s linear infinite;opacity:0}
@keyframes spf{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(70px);opacity:0}}
.origin{animation:hue 9s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="logo">FORORO</div>
    <div class="res"><div class="chip" id="cGold">🪙 0</div><div class="chip" id="cNrg">🔥 0/1</div><div class="chip" id="cSav">📖 0</div></div>
  </header>

  <section class="screen on" id="colScreen">
    <div class="viewer">
      <div class="counter" id="counter"></div>
      <button class="arrow l" id="prev" aria-label="Porte-armure précédent">‹</button>
      <div class="track" id="track"></div>
      <button class="arrow r" id="next" aria-label="Porte-armure suivant">›</button>
      <div class="flash" id="flash"></div>
    </div>
    <div class="info"><h2 id="title"></h2><div class="badge" id="badge"></div></div>
    <div class="slots" id="slots"></div>
    <div style="height:10px"></div>
  </section>

  <section class="screen" id="forgeScreen">
    <div class="scene" id="scene"></div>
    <div id="forgeBody"></div>
  </section>

  <section class="screen" id="marketScreen"><div id="marketBody"></div></section>
  <section class="screen" id="journalScreen"><div id="journalBody"></div></section>

  <nav>
    <button data-tab="forge"><span>🔥</span>Forge<i class="dot" id="dot"></i></button>
    <button data-tab="col" class="on"><span>🛡️</span>Collection</button>
    <button data-tab="market"><span>🪙</span>Marché</button>
    <button data-tab="journal"><span>📜</span>Journal</button>

 for(const b of boxes){const w=b.x1-b.x0,h=b.y1-b.y0,d=b.z1-b.z0;

 return `<svg viewBox="${(mnX-pad).toFixed(0)} ${(mnY-pad).toFixed(0)} ${(mxX-mnX+2*pad).toFixed(0)} ${(mxY-mnY+2*pad).toFixed(0)}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${aura}${outS.join('')}${opt.cls?`<g class="${opt.cls}">`:''}${out.join('')}${opt.cls?'</g>':''}${opt.after||''}</svg>`}

function upgCard(kind){const L=S.lv[kind],max=L>=MAXLV,c=upgCost(L);
 const eff=kind==='forge'?(l=>`−${4*(l-1)} % de temps`):(l=>`+${8*(l-1)} % d'or`);
 return `<div class="card upg"><h4>${kind==='forge'?'⚒️ Améliorer la forge':'🏪 Améliorer le marché'}<span class="lv">Niv. ${L}/${MAXLV}</span></h4>
  <p class="big" style="font-size:14px">Actuel : <b>${L>1?eff(L):'aucun bonus'}</b>${max?'':` → niveau ${L+1} : <b>${eff(L+1)}</b>`}</p>
  ${max?'<p class="note">Niveau maximum atteint !</p>':costHTML(c)+`<button class="btn forgego" data-upg="${kind}" ${canPay(c)?'':'disabled'}>Améliorer</button>`}</div>`}
function bindUpg(after){document.querySelectorAll('[data-upg]').forEach(b=>b.onclick=()=>{const k=b.dataset.upg,c=upgCost(S.lv[k]);if(!canPay(c))return;pay(c);S.lv[k]++;save();chips();after();
 toast(k==='forge'?`⚒️ Forge niveau ${S.lv.forge} : fabrications ${4*(S.lv.forge-1)} % plus rapides !`:`🏪 Marché niveau ${S.lv.market} : +${8*(S.lv.market-1)} % d'or !`,'',3000)})}
const duration=(p,t)=>Math.round(baseMin(t)*PFACT[p]*60*forgeMult())*1000;
const fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;return h?`${h} h ${String(m).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`};
const fmtLong=ms=>{const m=Math.round(ms/60000);return m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?' '+(m%60):''}`};
const setsInAge=a=>S.setsDone.filter(t=>ageOf(t)===a).length;
const unlockedAge=()=>{let a=1;while(a<8&&setsInAge(a)>=4)a++;return a};
const match=ids=>{const s=[...ids].sort().join('+');for(const t in RECIPES)if([...RECIPES[t]].sort().join('+')===s)return +t;return 0};

/* ================= ÉTAT DU JEU ================= */
const KEY='fororo.v6';
const fresh=()=>({stands:[
  {casque:1,plastron:1,bras:1,gants:1,jambes:1,bottes:1},
  {casque:4,plastron:4,bras:null,gants:null,jambes:4,bottes:null},
  {casque:null,plastron:null,bras:null,gants:null,jambes:null,bottes:null}],
 inv:[{p:'bras',t:4},{p:'gants',t:4},{p:'bottes',t:4},{p:'casque',t:2},{p:'gants',t:3}],
 mats:{bois:20,pierre:16,fer:12,argile:3,mousse:2,os:2},
 known:[1],jobs:[],gold:150,savoir:0,days:{},chests:{},lv:{forge:1,market:1},setsDone:[1]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.stands)S=fresh();
S.stands.forEach(st=>{let own=null;for(const p of PIECES){if(st[p]==null)continue;if(own==null)own=st[p];else if(st[p]!==own){(S.inv||=[]).push({p,t:st[p]});st[p]=null}}});
S.gold??=0;S.savoir??=0;S.days??={};S.lv??={forge:1,market:1};S.setsDone??=[...new Set(S.stands.map(st=>PIECES.map(p=>st[p])).filter(ts=>ts.every(t=>t!=null&&t===ts[0])).map(ts=>ts[0]))];S.jobs??=(S.job?[S.job]:[]);delete S.job;

/* ================= JOURNÉE (change à 4 h du matin) ================= */
const dayKey=(off=0)=>{const d=new Date(Date.now()-4*3600e3-off*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>{const k=dayKey();S.days[k]??={meals:[false,false,false],spent:0,study:0,sleep:null};return S.days[k]};
const capacity=()=>1+today().meals.filter(Boolean).length;   // forges simultanées : 1 + 1 par repas
const sleepMult=h=>h>=7&&h<=9?1.5:(h>=6&&h<7)||(h>9&&h<=10)?1.2:1;
const goldMult=()=>today().sleep?today().sleep.mult:1;
function chips(){document.getElementById('cGold').textContent='🪙 '+S.gold;document.getElementById('cNrg').textContent=`🔥 ${S.jobs.length}/${capacity()}`;document.getElementById('cSav').textContent='📖 '+S.savoir}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ================= COLLECTION ================= */
const $=id=>document.getElementById(id),track=$('track');let idx=0;
const total=()=>S.stands.length+(S.stands.length<MAXSTANDS?1:0);
const isBuy=i=>i===S.stands.length;
const EMPTY={casque:null,plastron:null,bras:null,gants:null,jambes:null,bottes:null};
function build(){track.innerHTML=[...Array(total())].map(()=>'<div class="slide"></div>').join('')}
function paint(i){if(!track.children[i])return;track.children[i].innerHTML=isBuy(i)?`<div class="buyslide">${render(EMPTY)}<span>+</span></div>`:render(S.stands[i])}
function go(i,anim=true){idx=Math.max(0,Math.min(total()-1,i));
 [idx-1,idx,idx+1].forEach(k=>{if(k>=0&&k<total()&&!track.children[k].innerHTML)paint(k)});
 track.style.transition=anim?'':'none';track.style.transform=`translateX(${-idx*100}%)`;
 $('counter').textContent=isBuy(idx)?'Nouveau porte-armure':`${idx+1} / ${S.stands.length}`;$('prev').disabled=idx===0;$('next').disabled=idx===total()-1;info()}
function trophies(){const a=unlockedAge(),base=(a-1)*8;return `<div class="troph" aria-label="Sets complétés"><small style="margin:0 6px 0 0">${AGES[a-1]}</small>${[1,2,3,4,5,6,7,8].map(k=>{const t=base+k;return `<i class="${S.setsDone.includes(t)?'on':''}" style="--c:${VP[t].ui}" title="${VP[t].n}"></i>`}).join('')}<small>${S.setsDone.length}/${NT} sets</small></div>`}
function info(){
 if(isBuy(idx)){const n=S.stands.length+1,c=standCost(n);$('title').textContent=`Porte-armure n°${n}`;const b=$('badge');b.textContent='Un emplacement de plus pour ta collection';b.style.color='#b3a6c4';
  $('slots').innerHTML=`<div class="buybox">${costHTML(c)}<button class="btn" id="buyStand" ${canPay(c)?'':'disabled'}>🔨 Construire</button></div>`;
  $('buyStand').onclick=()=>{if(!canPay(c))return;pay(c);S.stands.push({...EMPTY});save();chips();build();go(S.stands.length-1,false);toast(`Porte-armure n°${n} construit !`)};return}
 const a=S.stands[idx],ts=PIECES.map(k=>a[k]),own0=standArmor(a);
 $('title').textContent=own0!=null?`${VP[own0].n}`:`Porte-armure ${idx+1}`;const b=$('badge');
 if(ts.every(t=>t!=null&&t===ts[0])){b.textContent=`✨ Set complet · ${VP[ts[0]].n}`;b.style.color=VP[ts[0]].ui}
 else{const n=ts.filter(t=>t!=null).length;b.textContent=n===0?'Vide — touche une case pour équiper':`${n}/6 pièces équipées`;b.style.color='#b3a6c4'}
 $('slots').innerHTML=PIECES.map(p=>{const t=a[p];return t==null?`<button class="slot empty" data-p="${p}" aria-label="${LABEL[p]} vide"><small>${LABEL[p]}</small></button>`
  :`<button class="slot" data-p="${p}" style="--c:${VP[t].ui}" aria-label="${LABEL[p]} ${VP[t].n}">${icon(p,t)}</button>`}).join('')+trophies();
 document.querySelectorAll('.slot').forEach(s=>s.onclick=()=>openInv(s.dataset.p))}
function refresh(){paint(idx);info()}
let sx=0,dx=0,drag=false;
track.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;dx=0;track.style.transition='none';track.setPointerCapture(e.pointerId)});
track.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;if((idx===0&&dx>0)||(idx===total()-1&&dx<0))dx*=.35;track.style.transform=`translateX(calc(${-idx*100}% + ${dx}px))`});
const end=()=>{if(!drag)return;drag=false;go(dx<-50?idx+1:dx>50?idx-1:idx)};
track.addEventListener('pointerup',end);track.addEventListener('pointercancel',end);
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);

/* ---------- panneau du bas ---------- */
function openSheet(title,hint,html){$('sheettitle').textContent=title;$('sheethint').textContent=hint;$('sheetbody').innerHTML=html;$('app').classList.add('open')}
function closeSheet(){$('app').classList.remove('open')}
$('close').onclick=closeSheet;$('sheetbg').onclick=closeSheet;
const standArmor=st=>{for(const p of PIECES)if(st[p]!=null)return st[p];return null};
function openInv(p){const a=S.stands[idx],own=standArmor(a),items=S.inv.map((x,i)=>({...x,i})).filter(x=>x.p===p&&(own==null||x.t===own)).sort((x,y)=>y.t-x.t);
 let h=items.map(x=>`<button class="item" data-i="${x.i}" style="--c:${VP[x.t].ui}">${icon(p,x.t)}<span>${VP[x.t].n}</span></button>`).join('');
 if(a[p]!=null)h=`<button class="item remove" data-rm="1" style="--c:#ffffff44">Retirer<br>la pièce</button>`+h;
 openSheet(LABEL[p],own!=null?`Ce porte-armure accueille l'armure ${VP[own].n} : seules ses pièces peuvent y aller.${items.length?'':' Aucune en stock pour l\'instant, va la forger !'}`:(items.length?"Choisis une pièce : ce porte-armure sera ensuite réservé à cette armure.":'Aucune pièce de ce type en stock. Va la forger !'),`<div class="grid">${h}</div>`);
 $('sheetbody').querySelectorAll('.item').forEach(el=>el.onclick=()=>{const st=S.stands[idx];
  if(el.dataset.rm){S.inv.push({p,t:st[p]});st[p]=null}
  else{const it=S.inv.splice(+el.dataset.i,1)[0];if(st[p]!=null)S.inv.push({p,t:st[p]});st[p]=it.t}

  save();closeSheet();refresh();checkSet(S.stands[idx])})}

/* ---------- récompense du premier set complet ---------- */
const setChest=t=>{const p=posInAge(t);return p<=3?'fer':p<=6?'royal':'celeste'};
function checkSet(st){const ts=PIECES.map(p=>st[p]);if(!ts.every(t=>t!=null&&t===ts[0]))return;const t=ts[0];if(S.setsDone.includes(t))return;
 S.setsDone.push(t);const g=PIECES.reduce((a,p)=>a+orderGold(p,t),0),ck=setChest(t);S.gold+=g;S.chests[ck]=(S.chests[ck]||0)+1;save();chips();info();
 const ov=$('overlay');ov.innerHTML=`<h3>Premier set complet !</h3><div class="setshow" style="--c:${VP[t].ui}">${render(st)}</div>
  <p class="big" style="text-align:center"><b style="color:${VP[t].ui}">${VP[t].n}</b> rejoint ta collection.</p>
  <div class="loot" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:280px"><div class="drop" style="--c:#ffd24a"><div style="font-size:34px;line-height:1.4">🪙</div><b>${g.toLocaleString('fr-BE')} or</b><small>Récompense</small></div>
  <div class="drop" style="--c:${CHESTS[ck].ui};animation-delay:.2s">${chestIcon(ck)}<b>${CHESTS[ck].n}</b><small>À ouvrir au Marché</small></div></div>
  <button class="btn" id="ovok">Génial !</button>`;ov.classList.add('on');$('ovok').onclick=()=>ov.classList.remove('on')}

/* ---------- toast ---------- */
let tt;const toast=(m,svg='',ms=2600)=>{const el=$('toast');el.innerHTML=svg+'<span></span>';el.lastChild.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),ms)};

/* ================= FORGE ================= */
const FS={p:'casque',slots:[null,null,null]};
const sceneBoxes=[
 {k:'floor',x0:-16,x1:15,y0:-2,y1:0,z0:-8,z1:5},
 {k:'stone',x0:-15,x1:-5,y0:0,y1:12,z0:-7,z1:1,role:'four'},{k:'stone',x0:-13,x1:-7,y0:12,y1:19,z0:-6,z1:-1},
 {k:'iron',x0:3,x1:9,y0:0,y1:2,z0:-2,z1:2},{k:'iron',x0:4,x1:8,y0:2,y1:4,z0:-1,z1:1},
 {k:'iron',x0:1,x1:12,y0:4,y1:7,z0:-2,z1:2},{k:'iron',x0:12,x1:14,y0:5,y1:7,z0:-1,z1:1}];
const sceneSVG=()=>memo('scene',()=>draw(sceneBoxes,{pad:4}));
function jobCard(j,i){return `<div class="card"><h4>Forge ${i+1} · en cours</h4><div class="job"><div class="ico">${icon(j.p,j.t)}</div><div style="flex:1;min-width:0">
  <b>${LABEL[j.p]} · ${VP[j.t].n}</b><div class="bar"><i id="jbar${i}"></i></div><div class="timer" id="jtime${i}"></div></div></div>
  <div class="row2" id="jbtns${i}"></div></div>`}
function drawForge(){
 const J=S.jobs,cap=capacity(),free=J.length<cap;
 $('scene').innerHTML=sceneSVG()+(J[0]?`<div class="floating">${icon(J[0].p,J[0].t)}</div>`:'');
 let h=J.map(jobCard).join('');
 if(J.length)h+=`<p class="note" style="margin:8px 14px 0">📖 Le savoir gagné en étudiant (Journal) accélère la forge : 1 savoir = −10 min.</p>`;
 if(!free){h+=`<div class="card"><h4>Toutes tes forges sont occupées <button id="book">📖 Recettes</button></h4><p class="big">${cap<4?`Chaque repas coché dans le Journal débloque <b>1 forge de plus</b> pour la journée (jusqu'à 4).`:`Tu utilises tes 4 forges : bravo !`}</p></div>`}
 else{const t=match(FS.slots.filter(Boolean)),ids=FS.slots.filter(Boolean),metal=ids.find(x=>METALS.includes(x));
  const known=t&&S.known.includes(t);
  let res;if(!ids.length)res=`<div class="ico">⚒️</div><div><b>Choisis tes matériaux</b><small>Touche-les dans ton stock ci-dessous.</small></div>`;
  else if(known)res=`<div class="ico">${icon(FS.p,t)}</div><div><b style="color:${VP[t].ui}">${VP[t].n}</b><small>⏱ ${fmtLong(duration(FS.p,t))} · ${QTY[FS.p]} ${MATS[metal].n.toLowerCase()}</small></div>`;
  else res=`<div class="ico">❔</div><div><b>Combinaison inconnue</b><small>${metal?`Coûtera ${QTY[FS.p]} ${MATS[metal].n.toLowerCase()} si elle fonctionne.`:'Il faut au moins une matière de base.'}</small></div>`;
  h+=`<div class="card"><h4>1 · Pièce à forger <span style="font-family:'Alegreya Sans';font-size:13px;color:var(--muted)">forge ${J.length+1}/${cap}</span></h4><div class="ptypes">${PIECES.map(p=>`<button class="ptype ${p===FS.p?'sel':''}" data-p="${p}" aria-label="${LABEL[p]}">${icon(p,known?t:1)}</button>`).join('')}</div><div class="ptlabel">${LABEL[FS.p]} · ${QTY[FS.p]} unités de matière</div></div>`;
  h+=`<div class="card"><h4>2 · Combinaison <button id="book">📖 Recettes</button></h4><div class="combo">${FS.slots.map((m,i)=>(i?'<span class="plus">+</span>':'')+`<button class="cslot ${m?'full':''}" data-i="${i}" aria-label="${m?MATS[m].n+', retirer':'Emplacement vide'}">${m?matIcon(m):'·'}</button>`).join('')}</div>
   <div class="result" style="margin-top:10px;border-left:none;padding-left:0">${res}</div>
   <button class="btn forgego" id="go" ${ids.length?'':'disabled'}>🔨 Forger</button></div>`;}
 h+=upgCard('forge');
 h+=`<div class="card"><h4>Stock de matériaux</h4><div class="mats">${Object.keys(MATS).filter(id=>MATS[id].age<=unlockedAge()||S.mats[id]).map(id=>{const n=S.mats[id]||0;return `<button class="mat ${n?'':'zero'} ${FS.slots.includes(id)?'used':''}" data-m="${id}">${matIcon(id)}<span>${MATS[id].n}</span><em>${n}</em></button>`}).join('')}</div></div>`;
 $('forgeBody').innerHTML=h;bindUpg(drawForge);
 J.forEach((_,i)=>{const bx=$('jbtns'+i);if(bx)bx.dataset.s=''});tick();
 document.querySelectorAll('.ptype').forEach(b=>b.onclick=()=>{FS.p=b.dataset.p;drawForge()});
 document.querySelectorAll('.cslot').forEach(b=>b.onclick=()=>{FS.slots[+b.dataset.i]=null;drawForge()});
 document.querySelectorAll('.mat').forEach(b=>b.onclick=()=>{if(!free)return toast('Toutes tes forges sont occupées');const id=b.dataset.m;if(FS.slots.includes(id)){FS.slots[FS.slots.indexOf(id)]=null}else{const k=FS.slots.indexOf(null);if(k<0)return toast('3 matériaux maximum');FS.slots[k]=id}drawForge()});
 if($('book'))$('book').onclick=openBook;if($('go'))$('go').onclick=startForge;
}
function startForge(){const ids=FS.slots.filter(Boolean),t=match(ids);
 if(S.jobs.length>=capacity())return toast('Toutes tes forges sont occupées');
 if(!t)return toast("Ces matériaux ne s'allient pas… Essaie une autre combinaison !",'',3000);
 if(ageOf(t)>unlockedAge())return toast(`Cette alliance appartient à l'${AGES[ageOf(t)-1]}, pas encore débloqué.`,'',3200);
 const metal=RECIPES[t][0],need={[metal]:QTY[FS.p]};RECIPES[t].slice(1).forEach(m=>need[m]=1);
 const miss=Object.keys(need).filter(m=>(S.mats[m]||0)<need[m]);
 if(miss.length)return toast(`Pas assez de : ${miss.map(m=>MATS[m].n).join(', ')}`,'',3000);
 for(const m in need)S.mats[m]-=need[m];
 const isNew=!S.known.includes(t);if(isNew)S.known.push(t);
 const job={p:FS.p,t,start:Date.now(),dur:duration(FS.p,t)};S.jobs.push(job);FS.slots=[null,null,null];save();chips();drawForge();
 toast(isNew?`📖 Nouvelle recette découverte : ${VP[t].n} !`:`La forge chauffe : ${LABEL[job.p]} · ${VP[t].n}`,'',3200)}
function tick(){const now=Date.now();$('dot').classList.toggle('on',S.jobs.some(j=>now>=j.start+j.dur));
 S.jobs.forEach((j,i)=>{const tm=$('jtime'+i);if(!tm)return;const left=j.start+j.dur-now,done=left<=0;
  $('jbar'+i).style.width=Math.min(100,(1-left/j.dur)*100)+'%';tm.textContent=done?'Terminé !':fmt(left);
  const N=Math.ceil(left/600000);const want=done?'done':'run'+N+'-'+S.savoir;const box=$('jbtns'+i);if(box.dataset.s===want)return;box.dataset.s=want;
  box.innerHTML=done?`<button class="btn" data-claim="${i}">✨ Récupérer la pièce</button>`
   :`<button class="btn ghost" data-k="1" ${S.savoir<1?'disabled':''}>−10 min · 1 📖</button><button class="btn ghost" data-k="${N}" ${S.savoir<N?'disabled':''}>Finir · ${N} 📖</button>`;
  if(done){box.firstChild.onclick=()=>claim(i);return}
  box.querySelectorAll('[data-k]').forEach(bt=>bt.onclick=()=>{const n=+bt.dataset.k;if(S.savoir<n)return;S.savoir-=n;j.start-=n*600000;save();chips();tick()})})}
function claim(i){const j=S.jobs.splice(i,1)[0];if(!j)return;S.inv.push({p:j.p,t:j.t});save();chips();drawForge();
 toast(`${LABEL[j.p]} · ${VP[j.t].n} ajouté à ton inventaire !`,icon(j.p,j.t),3000)}
function openBook(){const ua=unlockedAge();let h='';
 for(let a=1;a<=8;a++){const done=setsInAge(a);
  h+=`<h4 class="agehead">${AGES[a-1]} <span>${a<=ua?`${done}/8 sets`:'🔒'}</span></h4>`;
  if(a>ua){h+=`<p class="note" style="margin:0 0 6px">Se débloque en complétant 4 sets de l'${AGES[a-2]}.</p>`;continue}
  for(let k=1;k<=8;k++){const t=(a-1)*8+k;h+=S.known.includes(t)
   ?`<div class="rec" style="--c:${VP[t].ui}"><div class="ico">${icon('casque',t)}</div><div><b>n°${t} · ${VP[t].n}</b><p>${RECIPES[t].map(m=>MATS[m].n).join(' + ')}</p></div></div>`
   :`<div class="rec unk"><div class="ico" style="display:grid;place-items:center;font-size:24px">❔</div><div><b>n°${t} · ???</b><p>${HINTS[t]}</p></div></div>`}}
 openSheet('Livre de recettes',`${S.known.length}/${NT} recettes découvertes. Le premier ingrédient est toujours une matière de base (bois, pierre, fer, sable, eau…).`,`<div class="recipes">${h}</div>`)}
setInterval(()=>{tick();marketTick()},1000);

/* ================= JOURNAL ================= */
const fmtH=min=>{const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h} h${m?' '+String(m).padStart(2,'0'):''}`:`${m} min`};
const MEALS=[['🥐','Petit-déj'],['🍲','Midi'],['🍝','Soir']];
let editSleep=false;
function drawJournal(){const d=today();let h='';
 h+=`<div class="card"><h4>Aujourd'hui</h4><div class="today">
  <div><b>🔥 ${capacity()}</b><small>forges en même temps</small></div>
  <div><b>📖 ${S.savoir}</b><small>savoir en stock</small></div>
  <div><b>×${String(goldMult()).replace('.',',')}</b><small>bonus d'or du jour</small></div></div></div>`;
 // sommeil
 h+=`<div class="card"><h4>😴 Sommeil de la nuit</h4>`;
 if(d.sleep&&!editSleep){const sl=d.sleep;h+=`<p class="big">Couché à <b>${sl.bed}</b>, levé à <b>${sl.wake}</b> → <b>${fmtH(sl.hours*60)}</b> de sommeil.<br>Bonus d'or du jour : <b>×${String(sl.mult).replace('.',',')}</b></p><button class="linkbtn" id="sedit">Modifier</button>`}
 else{const sl=d.sleep||{bed:'23:00',wake:'07:00'};h+=`<div class="times"><label>Coucher<input type="time" id="bed" value="${sl.bed}"></label><label>Lever<input type="time" id="wake" value="${sl.wake}"></label><button class="btn" id="ssave" style="font-size:14px">Valider</button></div>
  <p class="note">Entre 7 et 9 h : ×1,5 · 6–7 h ou 9–10 h : ×1,2 · sinon ×1. Le bonus multiplie l'or gagné aujourd'hui (commandes du Marché).</p>`}

 return c};

 const q=MATS[id].base?2+Math.floor(Math.random()*4):w>=4?1+Math.floor(Math.random()*3):w>=2?1+Math.floor(Math.random()*2):1;return [id,q]}

 catch(e){toast("Le téléchargement n'a pas marché ici.")}
